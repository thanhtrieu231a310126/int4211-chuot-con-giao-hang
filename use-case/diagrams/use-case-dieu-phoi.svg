<text x="435" y="29" font-size="19" font-weight="bold">Hệ thống điều phối giao hàng</text>
<text x="310" y="71.5" font-size="16" font-weight="normal">Đăng nhập</text>
<text x="310" y="88.5" font-size="14" font-weight="normal">UC-01</text>
<text x="310" y="142.5" font-size="16" font-weight="normal">Tạo, sửa và hủy đơn</text>
<text x="310" y="159.5" font-size="14" font-weight="normal">UC-02</text>
<text x="310" y="215.5" font-size="16" font-weight="normal">Quản lý tài khoản shipper</text>
<text x="310" y="232.5" font-size="14" font-weight="normal">UC-04</text>
<text x="310" y="315.5" font-size="16" font-weight="normal">Gán đơn cho shipper</text>
<text x="310" y="332.5" font-size="14" font-weight="normal">UC-06</text>
<text x="310" y="409.5" font-size="16" font-weight="normal">Theo dõi đơn trong ngày</text>
<text x="310" y="426.5" font-size="14" font-weight="normal">UC-07</text>
<text x="310" y="475.5" font-size="16" font-weight="normal">Xử lý đơn giao thất bại</text>
<text x="310" y="492.5" font-size="14" font-weight="normal">UC-13</text>
<text x="310" y="541.5" font-size="16" font-weight="normal">Đối soát COD</text>
<text x="310" y="558.5" font-size="14" font-weight="normal">UC-15</text>
<text x="310" y="607.5" font-size="16" font-weight="normal">Xem báo cáo và biểu đồ</text>
<text x="310" y="624.5" font-size="14" font-weight="normal">UC-16</text>
<text x="599" y="213.5" font-size="16" font-weight="normal">Xem và lọc đơn chưa gán</text>
<text x="599" y="230.5" font-size="14" font-weight="normal">UC-03</text>
<text x="599" y="416.5" font-size="16" font-weight="normal">Xem tải hiện tại của shipper</text>
